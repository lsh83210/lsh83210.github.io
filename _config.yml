# Build settings
plugins:
  - jekyll-feed
  - jekyll-tailwindcss

# Blog settings
permalink: /blog/:year/:month/:day/:title/
excerpt_separator: <!--more-->

defaults:
  - scope:
      path: "_posts"
      type: "posts"
    values:
      layout: "post"
      math: false

