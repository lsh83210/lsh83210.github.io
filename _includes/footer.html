<footer class="py-12 border-t border-border-subtle">
  <div class="max-w-4xl mx-auto px-6">
    <div class="flex justify-center gap-6 text-text-muted">
      <a href="mailto:{{ site.email }}" class="no-underline hover:text-accent transition-colors" aria-label="Email">
        {% include icons/envelope.html class="w-6 h-6" %}
      </a>
      <a href="https://scholar.google.com/citations?user={{ site.google_scholar }}" class="no-underline hover:text-accent transition-colors" aria-label="Google Scholar">
        <i class="ai ai-google-scholar text-2xl"></i>
      </a>
      <a href="https://www.linkedin.com/in/sanghyun-lee-2aa58b286/?skipRedirect=true" class="no-underline hover:text-accent transition-colors" aria-label="LinkedIn">
        {% include icons/linkedin.html class="w-6 h-6" %}
      </a>
      <a href="{{ '/assets/autoCV.pdf' | relative_url }}" class="no-underline hover:text-accent transition-colors" aria-label="CV">
        {% include icons/document.html class="w-6 h-6" %}
      </a>
    </div>
    <p class="text-center text-text-muted text-sm mt-6">
      &copy; {{ site.time | date: "%Y" }} {{ site.name }} · Template adapted from <a href="https://github.com/keunhong/keunhong.github.io">keunhong.github.io</a>.
    </p>
  </div>
</footer>
